# Cloudflare Pages 設定檔 —— [設計] 部署骨架，這個repo目前沒有Cloudflare帳號可以實際測試，
# 你要自己跑過一次 `wrangler pages deploy` 才能確認這份設定完全正確。
#
# 這份設定是依照2026年查證當下的官方文件寫的(developers.cloudflare.com/pages/functions/wrangler-configuration/)，
# 但Cloudflare的設定格式偶爾會變，尤其wrangler.toml跟新的wrangler.jsonc/wrangler.json兩種格式並存，
# 如果你要正式部署前，建議先確認：
#   1) `pages_build_output_dir` 是Pages專用欄位(跟Workers的`main`欄位不同)，需要對應到你的靜態資源目錄，
#      這個repo目前只有 `public/` 底下一個佔位首頁(還沒有真正的前端UI，前端UI是之後的工作)。
#   2) `compatibility_flags` 的 "nodejs_compat" 是必要的，因為 core/dice.js 用了
#      node:crypto 的 randomInt() 來擲骰——沒開這個flag，戰鬥/檢定相關的API會直接壞掉，
#      不是算錯，是整個函式丟例外。
#   3) compatibility_date 下面填的是一個「已知合法」的舊日期，不是隨便寫的——Cloudflare的
#      相容性日期機制是「早於這個日期的行為維持舊版相容」，你可以之後改成更新的日期，
#      但改之前建議先讀 https://developers.cloudflare.com/workers/configuration/compatibility-dates/
#      確認新日期不會改變你依賴的行為。

name = "wxh-engine"
pages_build_output_dir = "./public"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers AI 的binding —— 這是唯一「不需要任何API金鑰」的敘事供應商，
# 所以被設定成「你什麼金鑰都還沒申請時」的預設退路(見 content/llm/providers.js 的 pickProvider)。
#
# 它用的是你自己Cloudflare帳號的額度，不是別人的金鑰，也不是來路不明的公用代理。
# 查證2026-08-15當下的官方定價頁：每天有 10,000 Neurons 的免費額度，超過要升級Workers付費方案
# (https://developers.cloudflare.com/workers-ai/platform/pricing/)。
# 額度數字會變動，請自行對照最新文件。
#
# 如果你只想用Gemini/DeepSeek之類要金鑰的供應商，可以把這一段刪掉，不影響其他功能。
[ai]
binding = "AI"

# 存檔用的 KV namespace —— 沒有這一段的話，遊戲**仍然可以跑**，但存檔只會存在記憶體裡，
# 在 Cloudflare 上隨時會消失（每個 isolate 有自己的記憶體，而且 isolate 隨時會被回收）。
# 這種模式下 API 回傳的 persistent 會是 false，前端會顯示警告。
#
# 建立方式（把下面的 id 換成指令印出來的那一串）：
#   npx wrangler kv namespace create SAVES
#   npx wrangler kv namespace create SAVES --preview
#
# 如果你還沒建立，就把下面三行整段註解掉，不要留一個假的 id——
# 填錯的 id 會讓部署失敗，而且錯誤訊息不容易看懂。
# [[kv_namespaces]]
# binding = "SAVES"
# id = "把 wrangler kv namespace create SAVES 印出來的id貼在這裡"
