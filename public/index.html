<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-TRPG // Modern Tactical Minimal Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        zinc: {
                            50: '#fafafa',
                            100: '#f4f4f5',
                            500: '#71717a',
                            800: '#27272a',
                            850: '#121215',
                            900: '#18181b',
                            950: '#070709',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Subtle Architectural Grid Background */
        .dark .bg-tech-grid {
            background-image:
                radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 24px 24px, 48px 48px, 48px 48px;
            background-position: -1px -1px;
        }

        .bg-tech-grid {
            background-image:
                radial-gradient(rgba(0, 0, 0, 0.08) 1px, transparent 1px),
                linear-gradient(to right, rgba(0, 0, 0, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.02) 1px, transparent 1px);
            background-size: 24px 24px, 48px 48px, 48px 48px;
            background-position: -1px -1px;
            background-color: #fafafa;
        }

        /* Minimal Scrollbar */
        ::-webkit-scrollbar {
            width: 3px;
            height: 3px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #52525b;
            border-radius: 2px;
        }

        /* Custom Hairline Borders & Gradient Lines */
        .hairline-border {
            border-width: 1px;
        }
        .dark .hairline-border {
            border-color: rgba(255, 255, 255, 0.08);
        }
        html:not(.dark) .hairline-border {
            border-color: rgba(0, 0, 0, 0.08);
        }

        .gradient-top-border {
            position: relative;
        }
        .gradient-top-border::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(161, 161, 170, 0.3), transparent);
        }

        /* HUD Corner Brackets */
        .hud-corner-box {
            position: relative;
        }
        .hud-corner-box::before, .hud-corner-box::after {
            content: '';
            position: absolute;
            width: 5px;
            height: 5px;
            pointer-events: none;
            transition: border-color 0.2s ease;
        }
        .dark .hud-corner-box::before {
            top: -1px;
            left: -1px;
            border-top: 1.5px solid rgba(255, 255, 255, 0.3);
            border-left: 1.5px solid rgba(255, 255, 255, 0.3);
        }
        .dark .hud-corner-box::after {
            bottom: -1px;
            right: -1px;
            border-bottom: 1.5px solid rgba(255, 255, 255, 0.3);
            border-right: 1.5px solid rgba(255, 255, 255, 0.3);
        }

        html:not(.dark) .hud-corner-box::before {
            top: -1px;
            left: -1px;
            border-top: 1.5px solid rgba(0, 0, 0, 0.3);
            border-left: 1.5px solid rgba(0, 0, 0, 0.3);
        }
        html:not(.dark) .hud-corner-box::after {
            bottom: -1px;
            right: -1px;
            border-bottom: 1.5px solid rgba(0, 0, 0, 0.3);
            border-right: 1.5px solid rgba(0, 0, 0, 0.3);
        }

        /* Asymmetric Card Cutout Clip Path */
        .asymmetric-card {
            clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Card Stack Perspective Effects */
        .card-stack-container {
            position: relative;
            min-height: 140px;
            perspective: 800px;
        }

        .stack-card {
            position: absolute;
            width: 100%;
            top: 0;
            left: 0;
            transform-origin: center bottom;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .stack-card.active {
            z-index: 30;
            transform: translateY(0) scale(1);
            opacity: 1;
            filter: blur(0px);
        }

        .stack-card.behind-1 {
            z-index: 20;
            transform: translateY(-10px) scale(0.94);
            opacity: 0.75;
            filter: blur(0.5px);
        }

        .stack-card.behind-2 {
            z-index: 10;
            transform: translateY(-20px) scale(0.88);
            opacity: 0.45;
            filter: blur(1px);
        }

        /* Animations */
        @keyframes fadeInSlideUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in {
            animation: fadeInSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Mobile Frame Mode */
        .mobile-frame-mode {
            max-width: 412px !important;
            height: 820px !important;
            border-radius: 40px;
            border: 10px solid #27272a;
            margin: 20px auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1);
            overflow: hidden;
            position: relative;
        }
        html:not(.dark) .mobile-frame-mode {
            border: 10px solid #e4e4e7;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(0, 0, 0, 0.05);
        }

        .bottom-sheet {
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            will-change: transform;
        }
        .bottom-sheet.closed {
            transform: translateY(calc(100% - 56px));
        }
        .bottom-sheet.open {
            transform: translateY(0%);
        }

        /* Dice Animation */
        @keyframes tumble {
            0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
            100% { transform: rotateX(1080deg) rotateY(720deg) rotateZ(360deg); }
        }
        .animate-tumble {
            animation: tumble 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
    </style>
</head>
<body class="h-screen flex flex-col bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 antialiased selection:bg-zinc-800 bg-tech-grid transition-colors duration-200">

    <!-- Top Navigation Bar -->
    <header class="h-12 border-b hairline-border bg-white/90 dark:bg-zinc-950/90 text-zinc-900 dark:text-zinc-100 backdrop-blur-md px-4 flex items-center justify-between shrink-0 z-50 transition-colors">
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-1.5 font-mono text-xs uppercase tracking-widest">
                <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse"></span>
                <span class="font-bold">ECHOES</span>
                <span class="text-zinc-500">/</span>
                <span class="text-zinc-400 font-mono text-[11px]">SYS.v1.05</span>
            </div>
        </div>

        <!-- Mode & Theme Controls -->
        <div class="flex items-center gap-2">
            <!-- Light/Dark Toggle -->
            <button onclick="toggleTheme()" class="px-2.5 py-1 rounded bg-zinc-100 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300 hover:text-zinc-900 dark:hover:text-white text-xs font-mono border hairline-border transition-all flex items-center gap-1.5">
                <i id="theme-icon" class="fas fa-moon text-[10px]"></i>
                <span id="theme-text">暗黑風格</span>
            </button>

            <!-- Viewport Switcher -->
            <div class="flex items-center gap-1 bg-zinc-200/80 dark:bg-zinc-900/80 p-1 rounded-lg border hairline-border text-xs transition-colors">
                <button id="btn-desktop-view" onclick="setDeviceView('desktop')" class="px-2.5 py-1 rounded bg-white dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 font-medium transition-all flex items-center gap-1.5 border hairline-border shadow-sm">
                    <i class="fas fa-desktop text-[10px]"></i> 電腦多欄視角
                </button>
                <button id="btn-mobile-view" onclick="setDeviceView('mobile')" class="px-2.5 py-1 rounded text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-200 font-medium transition-all flex items-center gap-1.5">
                    <i class="fas fa-mobile-alt text-[10px]"></i> 手機抽屜視角
                </button>
            </div>
        </div>

        <div class="hidden md:flex items-center gap-4 text-xs font-mono text-zinc-500 dark:text-zinc-400">
            <!-- 規則引擎(/api/*)的連線狀態，由 app.js 依實際API回應更新 -->
            <span id="backend-status" class="px-2 py-0.5 rounded bg-zinc-100 dark:bg-zinc-900 border hairline-border text-zinc-500 text-[10px] font-mono">ENGINE ?</span>
            <span>劇本: <strong class="text-zinc-800 dark:text-zinc-200">JUDGE-01</strong></span>
        </div>
    </header>

    <!-- Main Application Viewport -->
    <div id="app-viewport" class="flex-1 flex overflow-hidden w-full max-w-7xl mx-auto transition-all duration-300 relative">

        <!-- LEFT PANEL: Character HUD Panel -->
        <aside id="sidebar-left" class="w-80 border-r hairline-border bg-white/80 dark:bg-zinc-950/80 backdrop-blur-xl flex flex-col shrink-0 transition-colors duration-300 z-10 hidden md:flex">

            <!-- Character Title Header -->
            <div class="p-4 border-b hairline-border space-y-2.5 relative gradient-top-border">
                <div class="flex items-start justify-between">
                    <div>
                        <div class="flex items-center gap-1.5 text-[10px] font-mono text-zinc-500 uppercase tracking-wider">
                            <span>OPERATIVE</span>
                            <span>•</span>
                            <span class="text-emerald-500 font-bold">ONLINE</span>
                        </div>
                        <h2 id="char-name" class="text-base font-bold text-zinc-900 dark:text-zinc-100 tracking-tight mt-0.5">—</h2>
                        <p id="char-class" class="text-xs font-mono text-zinc-500 dark:text-zinc-400">—</p>
                    </div>
                    <span class="px-2 py-0.5 text-[10px] font-mono font-bold rounded bg-zinc-200 dark:bg-zinc-900 text-zinc-700 dark:text-zinc-300 border hairline-border hud-corner-box transition-colors">D-TIER</span>
                </div>

                <!-- 傷勢軌 (完好 / 沖擊B / 嚴重L / 惡性A) —— 見 core/health.js。
                     這套規則沒有「剩餘HP」的概念：生命點數總量不變，只是在四個狀態之間轉換。 -->
                <div class="space-y-1 pt-1">
                    <div class="flex justify-between text-xs font-mono">
                        <span class="text-zinc-500 dark:text-zinc-400 flex items-center gap-1.5">
                            <i class="fas fa-heartbeat text-emerald-500 text-[11px]"></i> 完好生命
                        </span>
                        <span id="hp-text" class="text-zinc-800 dark:text-zinc-200 font-medium font-mono">—</span>
                    </div>
                    <!-- Segmented Visual Bar (由 app.js 依傷勢軌逐點產生) -->
                    <div id="hp-bar-container" class="grid gap-0.5 h-1.5 p-0.5 bg-zinc-200 dark:bg-zinc-900 rounded border hairline-border transition-colors"></div>
                    <div id="hp-detail" class="text-[10px] font-mono text-zinc-500 dark:text-zinc-500 pt-0.5">—</div>
                </div>
            </div>

            <!-- Attributes Section (No '//' & Slimmer boxes) -->
            <div class="p-4 border-b hairline-border space-y-2">
                <div class="flex justify-between items-center">
                    <span class="text-[10px] font-mono text-zinc-500 uppercase tracking-widest block font-semibold">九維屬性</span>
                    <i class="fas fa-sliders-h text-[10px] text-zinc-500"></i>
                </div>
                <!-- 九維屬性由 app.js 依 core/schema.js 的 ATTRIBUTES 順序產生。
                     「+n★」是傳奇屬性附加成功(見 core/dice.js)，不是D&D的attribute modifier。 -->
                <div id="attr-grid" class="grid grid-cols-2 gap-1.5 text-xs font-mono"></div>
            </div>

            <!-- Dynamic Asymmetric Stacked Trait Drawer -->
            <div class="p-4 flex-1 flex flex-col overflow-hidden space-y-3">
                <div class="flex items-center justify-between">
                    <span class="text-[10px] font-mono text-zinc-500 uppercase tracking-widest font-semibold">特質與資源卡</span>
                    <span class="text-[9px] font-mono text-zinc-500">點擊切換 ↻</span>
                </div>

                <!-- Resource Categories Tabs -->
                <div class="flex gap-1 overflow-x-auto pb-1 text-[10px] font-mono">
                    <button class="px-2 py-0.5 rounded bg-zinc-800 text-white dark:bg-zinc-200 dark:text-zinc-900 font-bold shrink-0 transition-colors">全部 (3)</button>
                    <button class="px-2 py-0.5 rounded bg-zinc-200 dark:bg-zinc-900 text-zinc-600 dark:text-zinc-400 shrink-0 border hairline-border transition-colors">義體</button>
                    <button class="px-2 py-0.5 rounded bg-zinc-200 dark:bg-zinc-900 text-zinc-600 dark:text-zinc-400 shrink-0 border hairline-border transition-colors">稱號</button>
                    <button class="px-2 py-0.5 rounded bg-zinc-200 dark:bg-zinc-900 text-zinc-600 dark:text-zinc-400 shrink-0 border hairline-border transition-colors">血脈</button>
                </div>

                <!-- Asymmetric Stacked Cards Container -->
                <!-- 資源卡由 app.js 的 renderCards() 產生，不放靜態範例卡，
                     避免「畫面上的卡」跟「角色卡資料裡的卡」出現兩份不同步的內容。 -->
                <div class="flex-1 pt-3 card-stack-container cursor-pointer select-none" id="cardStack" onclick="cycleCards()"></div>
            </div>
        </aside>

        <!-- CENTER PANEL: Clean Story Feed & Action Controls -->
        <main class="flex-1 flex flex-col h-full overflow-hidden bg-transparent z-0 relative">

            <!-- Narration Feed -->
            <div id="story-feed" class="flex-1 overflow-y-auto p-4 md:p-8 flex flex-col gap-6 pb-32 md:pb-8">

                <!-- 敘事區的內容全部由 app.js 動態產生：頁面載入時會先跑一次「開場回合」，
                     由 AI 描述場景並提出四個選項。這裡不放靜態範例文字，避免玩家分不出
                     哪些是真的由引擎+AI 產生的、哪些是寫死的樣板。 -->

            </div>

            <!-- Bottom Action Console (Desktop) -->
            <div id="desktopActionConsole" class="hidden md:flex flex-col border-t hairline-border bg-white/90 dark:bg-zinc-950/90 p-4 gap-3 shrink-0 backdrop-blur transition-colors">
                <!-- 四個選項由 AI 產生、引擎查驗過後，交給 app.js 的 renderOptions() 填入。
                     每個選項會顯示它對應的「屬性+技能・難度」，讓玩家看得到自己在賭什麼。 -->
                <div id="option-grid" class="grid grid-cols-2 gap-2"></div>

                <!-- 第五種：自訂行動。永遠存在，就算 AI 一個選項都沒給也能繼續玩。 -->
                <div class="flex gap-2 items-center">
                    <div class="relative flex-1">
                        <input type="text" data-action-input placeholder="[5] 自訂行動：描述你想做的事，按 Enter 送出..." class="w-full bg-zinc-100 dark:bg-zinc-900 border hairline-border pl-3 pr-10 py-2 text-sm focus:outline-none focus:border-emerald-500 transition text-zinc-900 dark:text-zinc-100 placeholder-zinc-500 dark:placeholder-zinc-600 rounded-sm">
                        <i class="fas fa-level-down-alt fa-rotate-90 absolute right-3 top-2.5 text-zinc-400 dark:text-zinc-600 text-xs pointer-events-none"></i>
                    </div>
                    <button data-send-custom class="bg-emerald-500/10 border border-emerald-500/50 text-emerald-600 dark:text-emerald-400 px-4 py-2 font-mono text-sm hover:bg-emerald-500/20 transition hud-corner-box whitespace-nowrap">
                        送出行動
                    </button>
                </div>
            </div>

        </main>
    </div>

    <!-- Mobile Bottom Sheet Drawer -->
    <div id="mobileDrawer" class="md:hidden absolute bottom-0 left-0 right-0 z-20 bg-zinc-50/95 dark:bg-zinc-950/95 border-t hairline-border backdrop-blur bottom-sheet closed h-[60vh] flex flex-col transition-colors">
        <!-- Drag Handle Area -->
        <div id="drawerHandle" class="h-8 flex items-center justify-center cursor-pointer w-full shrink-0 relative bg-zinc-200/80 dark:bg-zinc-900/50 transition-colors touch-none">
            <div class="w-12 h-1 bg-zinc-400 dark:bg-zinc-600 rounded-full transition-colors"></div>
        </div>

        <!-- Drawer Content -->
        <div class="flex-1 overflow-y-auto p-4 flex flex-col gap-4">
            <div class="flex flex-col gap-1 font-mono text-xs border-b hairline-border pb-2">
                <span id="mobile-hp-text" class="text-emerald-600 dark:text-emerald-500 transition-colors">—</span>
                <span id="mobile-attr-text" class="text-zinc-600 dark:text-zinc-400 transition-colors">—</span>
            </div>
            <!-- 手機版的四個選項，由 renderOptions() 同步填入 -->
            <div id="option-grid-mobile" class="flex flex-col gap-2"></div>

            <div class="relative mt-2">
                <input type="text" data-action-input placeholder="[5] 自訂行動..." class="w-full bg-zinc-200/80 dark:bg-zinc-900 border hairline-border pl-3 pr-10 py-3 text-sm focus:outline-none focus:border-emerald-500 transition text-zinc-900 dark:text-zinc-100 placeholder-zinc-500 dark:placeholder-zinc-600 rounded-sm">
                <i class="fas fa-level-down-alt fa-rotate-90 absolute right-3 top-3.5 text-zinc-400 dark:text-zinc-600 text-sm pointer-events-none"></i>
            </div>

            <button data-send-custom class="mt-auto w-full bg-emerald-500/10 border border-emerald-500/50 text-emerald-600 dark:text-emerald-400 px-4 py-3 font-mono text-sm hover:bg-emerald-500/20 transition hud-corner-box">
                送出行動
            </button>
        </div>
    </div>

    <!-- Dice Roll Modal Overlay (D10 logic) -->
    <div id="diceModal" class="fixed inset-0 z-50 flex items-center justify-center bg-zinc-100/80 dark:bg-black/80 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="flex flex-col items-center gap-6">

            <!-- 3D SVG dice pool representation container (d10 decahedron) -->
            <div class="w-32 h-32 relative transition-transform duration-500 flex flex-wrap gap-2 justify-center content-center" style="perspective: 500px;" id="diceContainer">
                <svg id="diceSvg" viewBox="0 0 100 100" class="w-20 h-20 text-emerald-500 drop-shadow-[0_0_15px_rgba(16,185,129,0.5)] origin-center" style="transform-style: preserve-3d;">
                    <!-- Decahedron (d10) representation for 2D/3D illusion -->
                    <polygon points="50,5 90,40 50,95 10,40" fill="none" stroke="currentColor" stroke-width="2" />
                    <polygon points="50,5 50,95 10,40" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2 2" />
                    <polygon points="50,5 90,40 50,95" fill="none" stroke="currentColor" stroke-width="1" />
                    <polygon points="10,40 90,40" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4" />
                    <text id="diceResultText" x="50" y="55" font-family="monospace" font-size="28" font-weight="bold" fill="currentColor" text-anchor="middle" dominant-baseline="middle" opacity="0">7</text>
                </svg>
            </div>

            <!-- Status Readout -->
            <div class="flex flex-col items-center font-mono text-sm text-zinc-900 dark:text-zinc-300 bg-zinc-200/80 dark:bg-zinc-900/80 px-6 py-4 border hairline-border hud-corner-box min-w-[280px]">
                <div id="diceStatus" class="text-emerald-600 dark:text-emerald-400 mb-2 font-bold animate-pulse">AWAITING INPUT...</div>
                <div id="diceFormula" class="text-xs text-zinc-600 dark:text-zinc-500 h-4 opacity-0 transition-opacity">骰池判定 (14) 成功數 = 7</div>
            </div>
        </div>
    </div>

    <script>
        // Theme Toggling
        const htmlEl = document.documentElement;
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');

        function toggleTheme() {
            const isDark = htmlEl.classList.contains('dark');
            if (isDark) {
                htmlEl.classList.remove('dark');
                themeIcon.classList.replace('fa-moon', 'fa-sun');
                themeText.textContent = '明亮風格';
            } else {
                htmlEl.classList.add('dark');
                themeIcon.classList.replace('fa-sun', 'fa-moon');
                themeText.textContent = '暗黑風格';
            }
        }

        // View Toggling (Desktop / Mobile Simulator)
        const appViewport = document.getElementById('app-viewport');
        const desktopSidebar = document.getElementById('sidebar-left');
        const desktopActionConsole = document.getElementById('desktopActionConsole');
        const mobileDrawer = document.getElementById('mobileDrawer');
        const btnDesktopView = document.getElementById('btn-desktop-view');
        const btnMobileView = document.getElementById('btn-mobile-view');

        let isMobileSim = false;

        function setDeviceView(view) {
            isMobileSim = (view === 'mobile');
            if (isMobileSim) {
                // Set to Mobile Simulator Mode
                appViewport.classList.add('mobile-frame-mode');

                // Hide Desktop elements
                desktopSidebar.classList.remove('md:flex');
                desktopSidebar.classList.add('!hidden');

                desktopActionConsole.classList.remove('md:flex');
                desktopActionConsole.classList.add('!hidden');

                // Show mobile drawer inside frame
                mobileDrawer.classList.remove('md:hidden');

                // Update Button Styles
                btnDesktopView.className = 'px-2.5 py-1 rounded text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-200 font-medium transition-all flex items-center gap-1.5';
                btnMobileView.className = 'px-2.5 py-1 rounded bg-white dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 font-medium transition-all flex items-center gap-1.5 border hairline-border shadow-sm';
            } else {
                // Set to Desktop Mode
                appViewport.classList.remove('mobile-frame-mode');

                // Restore Desktop elements
                desktopSidebar.classList.add('md:flex');
                desktopSidebar.classList.remove('!hidden');

                desktopActionConsole.classList.add('md:flex');
                desktopActionConsole.classList.remove('!hidden');

                // Hide mobile drawer
                mobileDrawer.classList.add('md:hidden');

                // Update Button Styles
                btnMobileView.className = 'px-2.5 py-1 rounded text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-200 font-medium transition-all flex items-center gap-1.5';
                btnDesktopView.className = 'px-2.5 py-1 rounded bg-white dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 font-medium transition-all flex items-center gap-1.5 border hairline-border shadow-sm';
            }
        }

        // Mobile Drawer Logic
        const drawerHandle = document.getElementById('drawerHandle');
        let drawerOpen = false;

        function toggleDrawer() {
            drawerOpen = !drawerOpen;
            if (drawerOpen) {
                mobileDrawer.classList.remove('closed');
                mobileDrawer.classList.add('open');
            } else {
                mobileDrawer.classList.add('closed');
                mobileDrawer.classList.remove('open');
            }
        }

        drawerHandle.addEventListener('click', toggleDrawer);

        // Touch gesture logic for dragging drawer
        let startY = 0;
        let currentY = 0;

        drawerHandle.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
            mobileDrawer.style.transition = 'none'; // remove transition for smooth drag
        }, {passive: true});

        drawerHandle.addEventListener('touchmove', (e) => {
            currentY = e.touches[0].clientY;
            const diffY = currentY - startY;

            if (drawerOpen && diffY > 0) {
                // Dragging down to close
                mobileDrawer.style.transform = `translateY(${diffY}px)`;
            } else if (!drawerOpen && diffY < 0) {
                // Dragging up to open
                mobileDrawer.style.transform = `translateY(calc(100% - 56px + ${diffY}px))`;
            }
        }, {passive: true});

        drawerHandle.addEventListener('touchend', (e) => {
            mobileDrawer.style.transition = ''; // restore CSS transition
            mobileDrawer.style.transform = ''; // clear inline transform

            const diffY = currentY - startY;

            if (Math.abs(diffY) > 50) {
                // threshold met
                if (drawerOpen && diffY > 0) {
                    toggleDrawer(); // close
                } else if (!drawerOpen && diffY < 0) {
                    toggleDrawer(); // open
                }
            }
        });

        // 3D Trait Card Cycle Logic
        // 卡片數量由 app.js 的 renderCards() 決定，所以順序陣列要能被重設，
        // 不能像舊版那樣寫死 [1,2,3]——卡片數量一變就會抓到不存在的 id 而丟錯。
        const cardClasses = ['active', 'behind-1', 'behind-2'];
        let currentOrder = [];

        function resetCardCycle(count) {
            currentOrder = Array.from({ length: count }, (_, i) => i + 1);
        }

        function cycleCards() {
            if (currentOrder.length < 2) return;

            currentOrder.unshift(currentOrder.pop());

            currentOrder.forEach((id, index) => {
                const card = document.getElementById(`card-${id}`);
                if (!card) return;
                card.classList.remove('active', 'behind-1', 'behind-2');
                card.classList.add(cardClasses[index] ?? 'behind-2');
            });
        }

        // Dice Roll Modal —— 純視覺層。
        // [重要] 這裡不再自己產生任何點數或成功數。骰子動畫只是「等待後端回應」的視覺表現，
        // 顯示出來的數字一律由 app.js 拿到 /api/check 的回傳值之後呼叫 showDiceResult() 填入。
        // 舊版在這裡寫死了一個 "7"，等於畫面上出現了一個沒有經過規則引擎的數字，
        // 那正是整個專案架構明文禁止的事(規則運算只能來自 core/)。
        const diceModal = document.getElementById('diceModal');
        const diceSvg = document.getElementById('diceSvg');
        const diceContainer = document.getElementById('diceContainer');
        const diceStatus = document.getElementById('diceStatus');
        const diceFormula = document.getElementById('diceFormula');
        const diceResultText = document.getElementById('diceResultText');

        function openDiceModal() {
            diceModal.classList.remove('opacity-0', 'pointer-events-none');
            diceSvg.classList.remove('animate-tumble');
            diceContainer.classList.remove('scale-150');
            diceResultText.style.opacity = '0';
            diceResultText.textContent = '';
            diceFormula.style.opacity = '0';
            diceFormula.textContent = '';
            diceStatus.textContent = 'ROLLING DICE POOL...';
            diceStatus.classList.add('animate-pulse');

            void diceSvg.offsetWidth; // 觸發reflow讓動畫可以重新播放
            diceSvg.classList.add('animate-tumble');
        }

        function showDiceResult(successText, formulaText) {
            diceStatus.textContent = 'CHECK RESOLVED';
            diceStatus.classList.remove('animate-pulse');
            diceContainer.classList.add('scale-150');
            diceResultText.textContent = successText;
            diceResultText.style.opacity = '1';
            diceFormula.textContent = formulaText ?? '';
            diceFormula.style.opacity = '1';
            armDiceModalClose();
        }

        function showDiceError() {
            diceStatus.textContent = 'ENGINE UNREACHABLE';
            diceStatus.classList.remove('animate-pulse');
            diceSvg.classList.remove('animate-tumble');
            diceFormula.textContent = '沒有取得判定結果，詳見敘事區的錯誤訊息';
            diceFormula.style.opacity = '1';
            armDiceModalClose();
        }

        function armDiceModalClose() {
            const closeHandler = () => {
                diceModal.classList.add('opacity-0', 'pointer-events-none');
                diceContainer.classList.remove('scale-150');
                diceModal.removeEventListener('click', closeHandler);
            };
            diceModal.addEventListener('click', closeHandler);
        }

        function closeDrawerIfOpen() {
            if (drawerOpen) toggleDrawer();
        }

        // 給 app.js 使用的介面(inline onclick 也靠這些全域名稱)
        window.cycleCards = cycleCards;
        window.resetCardCycle = resetCardCycle;
        window.toggleTheme = toggleTheme;
        window.setDeviceView = setDeviceView;
        window.openDiceModal = openDiceModal;
        window.showDiceResult = showDiceResult;
        window.showDiceError = showDiceError;
        window.closeDrawerIfOpen = closeDrawerIfOpen;

    </script>

    <!-- 應用邏輯(角色卡渲染 + /api/* 呼叫)。必須放在上面的 inline script 之後，
         因為它會用到 window.openDiceModal / resetCardCycle 等視覺層介面。 -->
    <script src="./app.js"></script>
</body>
</html>
