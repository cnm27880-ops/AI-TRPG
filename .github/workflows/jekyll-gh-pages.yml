# GitHub Pages —— 純靜態 UI 預覽用。
#
# [重要] 這個專案的正式部署平台是 Cloudflare Pages(見 DEPLOYMENT.md)，不是 GitHub Pages。
# 原因：遊戲的規則運算與AI敘事都跑在 functions/api/ 底下的 Cloudflare Pages Functions，
# GitHub Pages 只能提供靜態檔案、沒有辦法執行那些函式，所以在 GitHub Pages 上
# /api/check 與 /api/narrate 一定會 404，畫面會顯示「ENGINE OFFLINE」。
# 這裡保留這個 workflow 只是為了方便快速預覽UI外觀，不要拿它當正式站台。
#
# 另外：原本的版本用 Jekyll 建置整個 repo 根目錄(source: ./)，那會把 README/ARCHITECTURE
# 等文件、以及 15MB 的 rules-2.35.txt 規則書全文一起發佈到公開網址上。改成只上傳 public/，
# 網站需要的檔案就只有 public/ 裡的那些。
name: Deploy static UI preview to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static site (public/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
