name: AI-TRPG CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node tests and extreme matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint GitHub Actions workflow files
        run: npm run lint:workflows

      # prompt cache 三層契約的結構鎖（見 docs/PROMPT_CACHE_CONTRACT.md）。
      # 排在測試前面是刻意的：破壞分層的改動**不會**讓任何測試變紅，
      # 所以這支檢查是唯一會擋下它的東西，要讓它先講話。
      - name: Lint prompt cache layering contract
        run: npm run lint:prompt-cache

      # 副本的 authoring JSON 與 Cloudflare runtime .js 必須逐字一致。
      # test/scenarioRegistry.test.js 已經用 deepEqual 釘住這件事，所以這一步不是
      # 唯一的防線；接它是為了**錯誤訊息**：測試失敗只會說兩個大物件不相等，
      # 這支檢查會直接說「哪一個檔案不同步、跑哪一行指令修好」。
      - name: Lint scenario reference module sync
        run: npm run lint:reference-sync

      - name: Run complete regression suite with coverage gate
        run: npm run test:coverage

      - name: Run extreme turn and provider matrix
        run: npm run test:extreme

      # 純報告，**永遠不擋建置**（腳本本身一律 exit 0）。
      #
      # 死旗標是「寫進存檔之後沒有任何地方讀」的世界狀態：不會壞掉任何東西，
      # 只會讓那次失敗或成功變得沒有後果。它是待辦事項不是錯誤，所以不設門檻——
      # 設了門檻只會逼人為了讓 CI 變綠而亂接旗標，那比留著更糟。
      # 接它進 CI 的目的只有一個：讓這個數字每次 PR 都看得到，不用有人想到才去跑。
      - name: Report dead scenario flags (informational)
        run: npm run audit:dead-flags

  # 只在手動觸發時才會真的打真實API：這支job刻意不掛在push/pull_request上，
  # 因為每次push都打真實供應商會很快耗盡免費額度、也會讓CI對外部服務的可用性
  # 產生依賴(對方剛好429/維護，CI就變紅，但那跟這次PR的程式碼品質無關)。
  # 沒有設定對應的repository secret時，scripts/real-provider-smoke-test.mjs
  # 自己會優雅跳過(exit 0)，所以這個job不需要額外判斷secret存不存在。
  real-provider-smoke:
    name: Real provider smoke test (manual only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run real Groq/Mistral smoke test
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: npm run test:real-provider

      # 跟上面那支是兩件事：smoke test 驗傳輸與格式(429 header、finish_reason)，
      # 這一支驗**演出內容**——模型有沒有真的照著反客服協定與第四面牆條款寫。
      # 離線測試對提示詞的斷言只能證明「字串在 prompt 裡」，不能證明模型照做了。
      - name: Run narrative behaviour eval
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: npm run eval:narrative
